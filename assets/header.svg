<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">GitSummarizer</title>
  <desc id="d">Animated banner for GitSummarizer, repository intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0C0C"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity=".26"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#059669" stop-opacity=".22"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#8A6D1D"/>
      <stop offset=".3" stop-color="#D4AF37"/>
      <stop offset=".5" stop-color="#FFF1B8"/>
      <stop offset=".7" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8A6D1D"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D4AF37" stroke-opacity=".07" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="10s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="fadeG" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fade"><rect width="1200" height="320" fill="url(#fadeG)"/></mask>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" mask="url(#fade)"/>

  <ellipse cx="300" cy="150" rx="380" ry="190" fill="url(#goldGlow)">
    <animate attributeName="cx" values="300;900;300" dur="16s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </ellipse>
  <ellipse cx="950" cy="240" rx="320" ry="170" fill="url(#emeraldGlow)">
    <animate attributeName="cx" values="950;250;950" dur="20s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </ellipse>

  <g>
    <circle cx="693" cy="330" r="2.1" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="9.8s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="9.8s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1127" cy="330" r="0.9" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="11.1s" begin="-10.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="11.1s" begin="-10.1s" repeatCount="indefinite"/></circle>
    <circle cx="469" cy="330" r="0.9" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="10.0s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="10.0s" begin="-0.7s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="330" r="1.6" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="7.4s" begin="-4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="7.4s" begin="-4.2s" repeatCount="indefinite"/></circle>
    <circle cx="487" cy="330" r="1.7" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="11.1s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="11.1s" begin="-0.7s" repeatCount="indefinite"/></circle>
    <circle cx="842" cy="330" r="0.9" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="8.5s" begin="-4.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="8.5s" begin="-4.7s" repeatCount="indefinite"/></circle>
    <circle cx="302" cy="330" r="1.2" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="8.0s" begin="-0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="8.0s" begin="-0.9s" repeatCount="indefinite"/></circle>
    <circle cx="661" cy="330" r="1.6" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="11.8s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="11.8s" begin="-1.2s" repeatCount="indefinite"/></circle>
    <circle cx="414" cy="330" r="1.3" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="10.8s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="10.8s" begin="-0.7s" repeatCount="indefinite"/></circle>
    <circle cx="152" cy="330" r="1.7" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="10.5s" begin="-5.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="10.5s" begin="-5.6s" repeatCount="indefinite"/></circle>
    <circle cx="673" cy="330" r="1.5" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="13.5s" begin="-4.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="13.5s" begin="-4.9s" repeatCount="indefinite"/></circle>
    <circle cx="538" cy="330" r="1.9" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="11.9s" begin="-2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="11.9s" begin="-2.9s" repeatCount="indefinite"/></circle>
    <circle cx="644" cy="330" r="1.5" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="13.1s" begin="-9.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="13.1s" begin="-9.6s" repeatCount="indefinite"/></circle>
    <circle cx="619" cy="330" r="1.7" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="7.5s" begin="-3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="7.5s" begin="-3.8s" repeatCount="indefinite"/></circle>
    <circle cx="367" cy="330" r="1.9" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="8.1s" begin="-4.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="8.1s" begin="-4.0s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="330" r="2.1" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="7.5s" begin="-4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="7.5s" begin="-4.2s" repeatCount="indefinite"/></circle>
    <circle cx="672" cy="330" r="1.3" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="9.5s" begin="-4.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="9.5s" begin="-4.7s" repeatCount="indefinite"/></circle>
    <circle cx="964" cy="330" r="0.9" fill="#D4AF37" opacity="0"><animate attributeName="cy" from="330" to="-10" dur="7.7s" begin="-2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="7.7s" begin="-2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- frame -->
  <rect x="20" y="20" width="1160" height="280" rx="18" fill="none" stroke="#D4AF37" stroke-opacity=".16"/>
  <rect x="20" y="20" width="1160" height="280" rx="18" fill="none" stroke="#F5D76E" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="70 930">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g fill="none" stroke="#D4AF37" stroke-opacity=".7" stroke-width="1.5">
    <path d="M44 62V44H62"/><path d="M1156 62V44H1138"/>
    <path d="M44 258V276H62"/><path d="M1156 258V276H1138"/>
  </g>

  <!-- title -->
  <g text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="1.4s" fill="freeze"/>
    <text x="600" y="150" font-family="Georgia,'Times New Roman',serif" font-size="74" font-weight="700" letter-spacing="9" fill="url(#shimmer)">GITSUMMARIZER</text>
    <text x="600" y="200" font-family="'Courier New',Courier,monospace" font-size="15" letter-spacing="11" fill="#A8A29E">REPOSITORY INTELLIGENCE</text>
  </g>

  <!-- ornament line -->
  <line x1="600" y1="228" x2="600" y2="228" stroke="#D4AF37" stroke-width="1.2" stroke-opacity=".8">
    <animate attributeName="x1" from="600" to="380" dur="1.8s" begin=".4s" fill="freeze"/>
    <animate attributeName="x2" from="600" to="820" dur="1.8s" begin=".4s" fill="freeze"/>
  </line>
  <rect x="-4.5" y="-4.5" width="9" height="9" fill="#080808" stroke="#D4AF37" stroke-width="1.4" transform="translate(600 228) rotate(45)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin=".4s" fill="freeze"/>
  </rect>

  <text x="600" y="266" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="15" fill="#6B7280" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="1.2s" fill="freeze"/>
    Public repositories, distilled into architecture overviews and release notes.
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
