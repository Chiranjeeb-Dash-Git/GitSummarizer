<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="20" viewBox="0 0 1200 20" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset=".5" stop-color="#D4AF37" stop-opacity=".6"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0">
      <stop offset="0" stop-color="#FFF1B8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFF1B8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFF1B8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-260 0" to="1200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="9.25" width="1200" height="1.5" fill="url(#base)"/>
  <rect x="0" y="9" width="1200" height="2" fill="url(#sweep)"/>
  <circle cx="600" cy="10" r="9" fill="#D4AF37" opacity=".12">
    <animate attributeName="r" values="6;12;6" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".25;.04;.25" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(600 10)">
    <rect x="-4" y="-4" width="8" height="8" fill="#080808" stroke="#D4AF37" stroke-width="1.3">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
