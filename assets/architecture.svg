    <text class="s" x="58" y="280">React 18 · Vite · Tailwind v4</text>
    <text class="s" x="58" y="297">Zustand · React Query</text>
  </g>
  
  <g>
    <rect x="470" y="190" width="260" height="120" rx="14" fill="url(#card)" stroke="#D4AF37" stroke-opacity=".4" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values=".25;.85;.25" dur="4.5s" begin="0.7s" repeatCount="indefinite"/>
