    <circle r="3.8" fill="#F5D76E"/>
    <animateMotion dur="2.2s" begin="0s" repeatCount="indefinite"><mpath href="#req"/></animateMotion>
  </g>
  
  <g>
    <circle r="10" fill="#10B981" opacity=".18"/>
    <circle r="3.8" fill="#10B981"/>
