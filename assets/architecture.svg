<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">GitSummarizer architecture</title>
  <desc id="d">Animated data flow: React client, Express API, Neon PostgreSQL, GitHub REST API and AI providers.</desc>
  <defs>
    <style>
      .t{font:700 21px Georgia,'Times New Roman',serif;fill:#D4AF37}
      .s{font:12.5px 'Courier New',Courier,monospace;fill:#9CA3AF}
      .k{font:11px 'Courier New',Courier,monospace;fill:#6B7280;letter-spacing:3px}
      .l{font:12.5px 'Courier New',Courier,monospace;fill:#A8A29E}
      .le{font:12.5px 'Courier New',Courier,monospace;fill:#10B981}
    </style>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151515"/><stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity=".07"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <path id="req" d="M300 235H470"/><path id="res" d="M470 265H300"/><path id="toDb" d="M730 215C800 215 820 90 900 90"/><path id="toGh" d="M730 250H900"/><path id="toAi" d="M730 285C800 285 820 410 900 410"/>
  </defs>

  <rect width="1200" height="500" rx="20" fill="#080808"/>
  <rect width="1200" height="500" rx="20" fill="url(#bgGlow)"/>
  <rect x=".5" y=".5" width="1199" height="499" rx="20" fill="none" stroke="#D4AF37" stroke-opacity=".18"/>

  <use href="#req" fill="none" stroke="#D4AF37" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 7"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></use>
  <use href="#res" fill="none" stroke="#10B981" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 7"><animate attributeName="stroke-dashoffset" from="0" to="20" dur="1.2s" repeatCount="indefinite"/></use>
  <use href="#toDb" fill="none" stroke="#D4AF37" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 7"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></use>
  <use href="#toGh" fill="none" stroke="#D4AF37" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 7"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></use>
  <use href="#toAi" fill="none" stroke="#D4AF37" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 7"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></use>
  
  <g>
