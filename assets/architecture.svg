      <animate attributeName="stroke-opacity" values=".25;.85;.25" dur="4.5s" begin="2.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="918" y="208" width="26" height="2" fill="#059669"/>
    <text class="k" x="918" y="230">SOURCE</text>
    <text class="t" x="918" y="258">GitHub REST API</text>
    <text class="s" x="918" y="280">README · file tree</text>
    <text class="s" x="918" y="297">Manifests · commit history</text>
  </g>
  
  <g>
    <rect x="900" y="350" width="260" height="120" rx="14" fill="url(#card)" stroke="#D4AF37" stroke-opacity=".4" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values=".25;.85;.25" dur="4.5s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="918" y="368" width="26" height="2" fill="#059669"/>
    <text class="k" x="918" y="390">INFERENCE</text>
    <text class="t" x="918" y="418">AI Providers</text>
    <text class="s" x="918" y="440">Gemini · Claude · OpenAI</text>
    <text class="s" x="918" y="457">Streaming completions</text>
  </g>

  <text class="l" x="385" y="224" text-anchor="middle">1 · submit repo URL</text>
  <text class="le" x="385" y="292" text-anchor="middle">6 · SSE stream</text>
  <text class="l" x="800" y="128" text-anchor="end">2 · cache lookup / save</text>
  <text class="l" x="815" y="240" text-anchor="middle">3 · repo context</text>
  <text class="l" x="800" y="378" text-anchor="end">4 · prompt  5 · tokens</text>
  
  <g>
