  </g>
  
  <g>
    <circle r="10" fill="#F5D76E" opacity=".18"/>
    <circle r="3.8" fill="#F5D76E"/>
    <animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite"><mpath href="#toGh"/></animateMotion>
  </g>
  <g>
    <circle r="10" fill="#10B981" opacity=".18"/>
    <circle r="3.8" fill="#10B981"/>
    <animateMotion dur="2.0s" begin="2.0s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#toGh"/></animateMotion>
  </g>
  
  <g>
    <circle r="10" fill="#F5D76E" opacity=".18"/>
    <circle r="3.8" fill="#F5D76E"/>
    <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#toAi"/></animateMotion>
  </g>
  <g>
    <circle r="10" fill="#10B981" opacity=".18"/>
    <circle r="3.8" fill="#10B981"/>
    <animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#toAi"/></animateMotion>
